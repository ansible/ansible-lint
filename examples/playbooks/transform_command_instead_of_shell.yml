---
- name: Fixture
  hosts: localhost
  tasks:
    - name: Shell no pipe
      ansible.builtin.shell:
        cmd: echo hello
      changed_when: false

    - name: Shell with jinja filter
      ansible.builtin.shell:
        cmd: echo {{ "hello" | upper }}
      changed_when: false

    - name: Shell with jinja filter (fqcn)
      ansible.builtin.shell:
        cmd: echo {{ "hello" | upper }}
      changed_when: false

    - name: Command with executable parameter
      ansible.builtin.shell:
        cmd: clear
      args:
        executable: /bin/bash
      changed_when: false

    - name: Print uptime
      changed_when: false
      shell: uptime # Include the load averages.

    # Print the kernel release separately.
    - name: Print kernel release
      ansible.builtin.shell: |-
        uname -r
      # The kernel version check is read-only.
      changed_when: false
