id: openapi-drift
title: "OpenAPI spec drift \u2014 route missing from spec"
trigger_type: ci_failure
log_pattern: Routes in code but MISSING from
cause: A new route was added to the backend router but the corresponding endpoint
  definition was not added to api/openapi.yaml.
fix_description: Add the missing endpoint definition (path, method, operationId, response
  schema) to api/openapi.yaml and register any new tags in the global tags section.
fix_steps:
- Identify the missing route from the CI log output
- Open api/openapi.yaml
- Add the endpoint definition under the paths section
- If using a new tag, add it to the global tags list
- Run 'yarn openapi:check-drift' locally to verify the fix
auto_fixable: false
auto_fix_command: ''
