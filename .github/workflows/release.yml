---
name: release

"on":
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # https://github.com/marketplace/actions/actions-tagger
  actions-tagger:
    needs: pypi # do not move the mobile tag until we publish
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: Actions-R-Us/actions-tagger@57651eb6fb65f39f30ee5c74ec32ea54850ea4ff8 # v2.1.0
        with:
          token: "${{ github.token }}"
          # Do not activate latest tag because it seems to affect RTD builds
          # publish_latest_tag: true
  pypi:
    name: Publish to PyPI registry
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    env:
      FORCE_COLOR: 1
      PY_COLORS: 1
      TOXENV: pkg

    steps:
      - name: Switch to using latest Python by default
        uses: actions/setup-python@11d48d784bee1c51dcf3fe1718cfab5191b50317 # v5.3.0
        with:
          python-version: "3.14"

      - name: Install tox
        run: python3 -m pip install --user "tox>=4.0.0"

      - name: Check out src from Git
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          fetch-depth: 0 # needed by setuptools-scm
          submodules: true

      - name: Build dists
        run: python3 -m tox

      - name: Publish to pypi.org
        if: >- # "create" workflows run separately from "push" & "pull_request"
          github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@f7600ce193dcc2ea22227bd8acc77b288953cead7 # release/v1
