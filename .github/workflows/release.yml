---
name: release

"on":
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # https://github.com/marketplace/actions/actions-tagger
  actions-tagger:
    needs: pypi # do not move the mobile tag until we publish
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: Actions-R-Us/actions-tagger@330ddfac760021349fef7ff62b372f2f691c20fb # v2.0.3
        with:
          token: "${{ github.token }}"
          # Do not activate latest tag because it seems to affect RTD builds
          # publish_latest_tag: true
  pypi:
    name: Publish to PyPI registry
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    env:
      FORCE_COLOR: 1
      PY_COLORS: 1
      TOXENV: pkg

    steps:
      - name: Switch to using latest Python by default
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install tox
        run: python3 -m pip install --user "tox>=4.0.0"

      - name: Check out src from Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed by setuptools-scm
          submodules: true

      - name: Build dists
        run: python3 -m tox

      - name: Publish to pypi.org
        if: >- # "create" workflows run separately from "push" & "pull_request"
          github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
