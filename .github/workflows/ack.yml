---
# See https://github.com/ansible/team-devtools/blob/main/.github/workflows/ack.yml
name: ack
on:
  merge_group:
  pull_request_target:
    types: [opened, labeled, unlabeled, synchronize]

permissions: {}

jobs:
  ack:
    uses: ansible/team-devtools/.github/workflows/ack.yml@main
    # The called workflow cannot have more than this job grants, and the
    # top-level permissions above grant nothing.
    permissions:
      checks: write
      contents: write
      pull-requests: write
    secrets: inherit
